<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#1976d2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Elite Car Shine" />
    <!-- Android/Huawei PWA meta tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Elite Car Shine" />
    <meta name="msapplication-TileColor" content="#1976d2" />
    <meta name="msapplication-tap-highlight" content="no" />
    <!-- Huawei AppGallery meta tags -->
    <meta name="huawei-mobile-web-app-capable" content="yes" />
    <meta name="huawei-mobile-web-app-status-bar-style" content="default" />
    <meta
      name="description"
      content="Elite Car Shine Employee Portal - Mobile access for field workers"
    />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
    />
    <title>Elite Car Shine - Employee Portal</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    
    <script>
      // Register Service Worker for PWA functionality
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('SW registered: ', registration);
            })
            .catch((registrationError) => {
              console.log('SW registration failed: ', registrationError);
            });
        });
      }
      
      // Enhanced PWA install detection for Android/Huawei
      window.addEventListener('beforeinstallprompt', (e) => {
        // Store the event for later use by React component
        window.deferredPrompt = e;
        console.log('PWA install prompt available');
      });
      
      // Track app installation
      window.addEventListener('appinstalled', () => {
        console.log('PWA was installed');
        window.deferredPrompt = null;
      });
    </script>
  </body>
</html>
